# mail-baku configuration
#
# To override settings at runtime, use environment variables
# (e.g. MAIL_BAKU_MAIL_PORT=2525) or point QUARKUS_CONFIG_LOCATIONS
# to an external properties file.

quarkus.http.port=8080

# SMTP server settings
#mail-baku.mail.bind.address=0.0.0.0
#mail-baku.mail.port=1025

# Comma separated list of IP addresses / CIDR subnets allowed to access the web UI.
# When empty, all addresses are allowed.
#mail-baku.allowed.addresses=127.0.0.1

# Use a dedicated SMTP port while running tests
%test.mail-baku.mail.port=2525
